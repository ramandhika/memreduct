name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: memreduct-windows
          path: target/release/memreduct.exe

  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install linuxdeploy
        run: |
          curl -LO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
      - name: Build AppImage
        env:
          LINUXDEPLOY: linuxdeploy-x86_64.AppImage
          PKG_VERSION: ${{ github.ref_name }}
        run: bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: memreduct-linux-appimage
          path: "*.AppImage"
