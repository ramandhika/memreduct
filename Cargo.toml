[package]
name = "memreduct"
version = "0.4.0"
edition = "2021"
description = "A lightweight memory reduction utility for Windows and Linux"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "=0.31.1"
egui = "=0.31.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "=0.20.0"

[target.'cfg(not(windows))'.dependencies]
# KDE/freedesktop StatusNotifierItem tray (status bar on Plasma).
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
lto = "thin"
opt-level = 2
